openapi: 3.0.3
info:
  title: Krampus API
  version: "1.0.0"
  description: >
    Real-time messaging backend (REST + WebSocket + SSE).
    Generated from docs/API.md, which is the authoritative reference.
    All `/api/v1/chat/*` endpoints require a Bearer JWT (`Authorization: Bearer <access_token>`).
servers:
  - url: http://localhost:8080
    description: Local development (docker compose)

tags:
  - name: Health
  - name: Authentication
  - name: Messages
  - name: Rooms
  - name: Users
  - name: Polls
  - name: Reactions
  - name: Stickers
  - name: Sync
  - name: Moderation
  - name: Profile
  - name: Call
  - name: Realtime
    description: WebSocket / SSE endpoints (not fully modelled by OpenAPI; see descriptions)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Server health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  # ──────────────────────────────── Auth ────────────────────────────────
  /api/v1/auth/signup:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/auth/signin:
    post:
      tags: [Authentication]
      summary: Login (returns tokens or a 2FA challenge)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SigninRequest" }
      responses:
        "200":
          description: Tokens, or a temp token when 2FA is enabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenResponse"
                  - $ref: "#/components/schemas/TwoFARequired"
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify:
    post:
      tags: [Authentication]
      summary: Verify a 2FA TOTP code using the temp token from signin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, code]
              properties:
                temp_token: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/enable:
    post:
      tags: [Authentication]
      summary: Enable 2FA for the authenticated user
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Error" }

  # ──────────────────────────────── Messages ────────────────────────────
  /api/v1/chat/messages:
    post:
      tags: [Messages]
      summary: Send a message to a room
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "200":
          description: Accepted / written
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: sent }
                  msg_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/chat/rooms/{room_id}/messages:
    get:
      tags: [Messages]
      summary: Fetch recent messages in a room
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 1000 }
      responses:
        "200":
          description: Array of messages (newest-first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BaseMessage" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/chat/rooms/{room_id}/search:
    get:
      tags: [Messages]
      summary: Full-text search over messages in a room
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }
        "401": { $ref: "#/components/responses/Error" }

  # ──────────────────────────────── Rooms ───────────────────────────────
  /api/v1/chat/rooms:
    post:
      tags: [Rooms]
      summary: Create a room (creator is auto-added as a member; client-supplied id required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      tags: [Rooms]
      summary: List rooms the authenticated user is a member of
      responses:
        "200":
          description: Array of rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/chat/rooms/{room_id}:
    get:
      tags: [Rooms]
      summary: Get room details
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/chat/rooms/join:
    post:
      tags: [Rooms]
      summary: Join a room (grants membership); accepts a deep link or a bare room id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  example: "krampus://join/room-uuid"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: joined }
                  room: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ──────────────────────────────── Users ───────────────────────────────
  /api/v1/chat/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Array of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/chat/users/{user_id}:
    get:
      tags: [Users]
      summary: Get a user's public profile
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }

  # ──────────────────────────────── Polls ───────────────────────────────
  /api/v1/chat/rooms/{room_id}/polls/{poll_id}/vote:
    post:
      tags: [Polls]
      summary: Cast a vote on a poll
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/PollId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_id]
              properties:
                option_id: { type: string, example: opt1 }
      responses:
        "200":
          description: Voted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: voted }

  /api/v1/chat/rooms/{room_id}/polls/{poll_id}:
    get:
      tags: [Polls]
      summary: Get poll results
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/PollId" }
      responses:
        "200":
          description: Poll results
          content:
            application/json:
              schema:
                type: object
                properties:
                  poll_id: { type: string }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        votes: { type: integer }

  # ─────────────────────────────── Reactions ────────────────────────────
  /api/v1/chat/messages/{message_id}/reactions:
    post:
      tags: [Reactions]
      summary: Add an emoji reaction to a message
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, example: "👍" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ─────────────────────────────── Stickers ─────────────────────────────
  /api/v1/chat/stickers:
    get:
      tags: [Stickers]
      summary: List all sticker packs
      responses:
        "200":
          description: Sticker packs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    stickers:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: string }
                          emoji: { type: string }

  # ──────────────────────────────── Sync ────────────────────────────────
  /api/v1/chat/sync:
    get:
      tags: [Sync]
      summary: Device's last-seen event sequence (gap detection)
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Last event sequence
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_event_sequence: { type: integer, example: 4201 }

  # ─────────────────────────────── Moderation ───────────────────────────
  /api/v1/chat/moderation/ban:
    post:
      tags: [Moderation]
      summary: Ban a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id: { type: string }
                reason: { type: string, example: spam }
      responses:
        "200":
          description: Banned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: banned }

  /api/v1/chat/moderation/mute:
    post:
      tags: [Moderation]
      summary: Mute a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
                duration_seconds: { type: integer }
      responses:
        "200":
          description: Muted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: muted }

  # ──────────────────────────────── Profile ─────────────────────────────
  /api/v1/chat/profile/avatar:
    post:
      tags: [Profile]
      summary: Upload an avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

  /api/v1/chat/profile/{user_id}:
    get:
      tags: [Profile]
      summary: Get a user's profile (avatar, etc.)
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

  # ──────────────────────────────── Call ────────────────────────────────
  /api/v1/chat/call/ice-servers:
    get:
      tags: [Call]
      summary: STUN/TURN ICE server list for WebRTC
      responses:
        "200":
          description: ICE servers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ICEServersResponse" }
        "401": { $ref: "#/components/responses/Error" }

  # ─────────────────────────── Realtime (WS / SSE) ──────────────────────
  /ws:
    get:
      tags: [Realtime]
      summary: Chat WebSocket (upgrade)
      description: >
        WebSocket endpoint for realtime chat. Authenticated via query params
        (WebSocket cannot send Authorization headers from the browser).
        Exchanges `BaseMessage` envelopes; `text`/`file` are persisted, while
        `typing`/`read_receipt`/`ack`/`video_call`/`webrtc_signal` are
        realtime-only. Not fully modelled by OpenAPI.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Access-token JWT
        - name: room_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "401": { $ref: "#/components/responses/Error" }

  /sse:
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream (read-only per room)
      description: >
        SSE stream of `BaseMessage` frames per room. Supports gap replay on
        reconnect via `Last-Event-ID` header or `last_event_id` query param.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: room_id
          in: query
          required: true
          schema: { type: string }
        - name: last_event_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /call/ws:
    get:
      tags: [Realtime, Call]
      summary: Call signaling WebSocket (WebRTC relay, upgrade)
      description: >
        Dedicated ephemeral WebRTC signaling relay. On connect with `type=call`
        the client sends a `checkCountUserCall` frame and the server replies with
        the current call-peer count before registering the peer; thereafter every
        frame is broadcast verbatim to the other peers in the room. Auth is the
        same as `/ws` (JWT + Redis session + room membership). When the per-room
        cap (`CALL_MAX_PEERS`) is exceeded the socket is closed with code 1013.
        Not fully modelled by OpenAPI.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Access-token JWT
        - name: room_id
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [call, preliminary] }
          description: "`call` joins the media channel; anything else is a passive chat listener."
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoomId:
      name: room_id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string }
    PollId:
      name: poll_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error (AppError envelope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AppError" }

  schemas:
    AppError:
      type: object
      properties:
        code:
          type: string
          enum:
            - INVALID_MESSAGE
            - UNAUTHORIZED
            - FORBIDDEN
            - ROOM_NOT_FOUND
            - USER_NOT_FOUND
            - DUPLICATE_ERROR
            - VALIDATION_ERROR
            - RATE_LIMIT
            - PAYLOAD_TOO_LARGE
            - TIMEOUT_ERROR
            - STORAGE_ERROR
            - CONNECTION_ERROR
            - INTERNAL_ERROR
        message: { type: string, example: token expired }

    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: alice }
        firstname: { type: string, example: Alice }
        lastname: { type: string, example: Smith }
        email: { type: string, format: email }
        password: { type: string, format: password }
        two_fa_enabled: { type: boolean, default: false }

    SigninRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    TwoFARequired:
      type: object
      properties:
        temp_token: { type: string }
        requires_two_fa: { type: boolean, example: true }

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 42 }
        username: { type: string }
        firstname: { type: string }
        lastname: { type: string }
        email: { type: string, format: email }
        two_fa_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        status: { type: string, example: online }

    Room:
      type: object
      properties:
        id: { type: string, example: room-uuid }
        type: { type: string, enum: [personal, private, group, video_call] }
        owner_id: { type: string }
        name: { type: string }
        members:
          type: array
          items: { type: string }
        settings: { type: object }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    CreateRoomRequest:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string, description: Client-supplied room id }
        type: { type: string, enum: [personal, private, group, video_call] }
        name: { type: string }
        members:
          type: array
          items: { type: string }

    SendMessageRequest:
      type: object
      required: [room_id, type, payload]
      properties:
        room_id: { type: string }
        type: { type: string, example: text }
        payload:
          type: object
          example: { text: "Hello!" }

    BaseMessage:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: text }
        user_id: { type: string }
        room_id: { type: string }
        timestamp: { type: integer, format: int64, description: Unix nanoseconds }
        version: { type: integer }
        payload: { type: object }
        reply_to_id: { type: string, nullable: true }
        forwarded_from_id: { type: string, nullable: true }
        topic_id: { type: string, nullable: true }
        metadata: { type: object }

    Profile:
      type: object
      properties:
        user_id: { type: string }
        avatar_media_id: { type: string }

    SearchResult:
      type: object
      properties:
        message_id: { type: string }
        room_id: { type: string }
        user_id: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }

    ICEServer:
      type: object
      properties:
        urls:
          type: array
          items: { type: string }
        username: { type: string }
        credential: { type: string }

    ICEServersResponse:
      type: object
      properties:
        iceServers:
          type: array
          items: { $ref: "#/components/schemas/ICEServer" }
