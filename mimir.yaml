multitenancy_enabled: false
server:
  http_listen_port: 8080

blocks_storage:
  backend: local
  local:
    directory: /tmp/mimir/tsdb-blocks

ruler_storage:
  backend: local
  local:
    directory: /tmp/mimir/rules

compactor:
  data_dir: /tmp/mimir/compactor
  block_retention: 24h

limits:
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 12
  max_global_series_per_user: 500k
