apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    url: http://mimir:8080/prometheus
    access: proxy
    isDefault: true

  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    access: proxy

  - name: Elasticsearch
    type: elasticsearch
    url: http://elasticsearch:9200
    access: proxy
    database: krampus-logs-*
