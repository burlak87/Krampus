# ─────────────────────────────────────────────────────────────────────────────
# Krampus — full local stack for testing
#
# Services:
#   app       — Go backend  → http://localhost:8080
#   frontend  — static UI   → http://localhost:3000
#   postgres, redis, zookeeper, kafka, minio
#
# Usage:
#   cp .env.example .env        # first time only
#   docker-compose up -d --build
#   docker-compose down -v      # remove containers + volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krampus_app
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      ENV:               development
      HTTP_PORT:         ":8080"
      NODE_ID:           node-1
      POSTGRES_DSN:      "postgres://${POSTGRES_USER:-krampus}:${POSTGRES_PASSWORD:-krampus_pass}@postgres:5432/${POSTGRES_DB:-krampus}?sslmode=disable"
      REDIS_ADDR:        redis:6379
      REDIS_PASSWORD:    "${REDIS_PASSWORD:-}"
      REDIS_DB:          "0"
      KAFKA_BROKERS:     kafka:29092
      KAFKA_TOPICS_INCOMING:  incoming
      KAFKA_TOPICS_VALIDATED: validated
      KAFKA_TOPICS_SAVED:     saved
      KAFKA_TOPICS_BROADCAST: broadcast
      AWS_ENDPOINT:      http://minio:9000
      AWS_REGION:        "${AWS_REGION:-us-east-1}"
      AWS_BUCKET:        "${AWS_BUCKET:-krampus-media}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      JWT_SECRET:        "${JWT_SECRET:-change-me-to-a-long-random-secret}"
      FILE_BASE_PATH:    /app/storage
      FILE_SEGMENT_SIZE: 1h
      CALL_PRESENCE_TTL: "${CALL_PRESENCE_TTL:-30s}"
      CALL_MAX_PEERS:    "${CALL_MAX_PEERS:-8}"
      STUN_SERVERS:      "${STUN_SERVERS:-stun:stun.l.google.com:19302}"
      TURN_URL:          "${TURN_URL:-}"
      TURN_USER:         "${TURN_USER:-}"
      TURN_PASS:         "${TURN_PASS:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped
    networks:
      - krampus-net

  # Nuxt 3 dev server. NUXT_PUBLIC_* point at localhost:8080 because they are
  # consumed by the BROWSER (running on the host), which reaches the backend
  # via its published port — not over the compose network.
  frontend:
    image: node:22-alpine
    container_name: krampus_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: "${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}"
      NUXT_PUBLIC_WS_BASE:  "${NUXT_PUBLIC_WS_BASE:-ws://localhost:8080}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - krampus-net

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    container_name: krampus_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-krampus}
      POSTGRES_USER:     ${POSTGRES_USER:-krampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krampus_pass}
    ports:
      # Host 5433 → container 5432 (host 5432 is taken by a local Postgres).
      # The app reaches Postgres internally as postgres:5432 regardless.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krampus} -d ${POSTGRES_DB:-krampus}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - krampus-net

  redis:
    image: redis:7-alpine
    container_name: krampus_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      # Host 6380 → container 6379 (host 6379 is taken by a local Redis).
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - krampus-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: krampus_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      # Use "srvr" (enabled by default); "ruok" is not in this image's whitelist.
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - krampus-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: krampus_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - krampus-net

  minio:
    image: minio/minio:latest
    container_name: krampus_minio
    command: server /data --console-address ":9001"
    ports:
      # Host 9100/9101 → container 9000/9001 (host 9000/9001 are taken).
      # The app uses minio internally via http://minio:9000.
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER:     ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - krampus-net

  minio-init:
    image: minio/mc:latest
    container_name: krampus_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/$${AWS_BUCKET:-krampus-media}
      "
    networks:
      - krampus-net

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  minio_data:
  app_storage:
  frontend_node_modules:

networks:
  krampus-net:
    driver: bridge
